# Configuration Apache pour Assistant PPV
# Fichier: /etc/apache2/sites-available/chatbot-ppv.conf
#
# À adapter selon ton environnement Lyon/SNCF

<VirtualHost *:80>
    ServerName ppv-assistant.local
    ServerAlias ppv-assistant
    DocumentRoot /var/www/chatbot-ppv/public

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/ppv-chatbot-error.log
    CustomLog ${APACHE_LOG_DIR}/ppv-chatbot-access.log combined

    # Activer les modules nécessaires
    # a2enmod proxy
    # a2enmod proxy_http
    # a2enmod rewrite
    # a2enmod headers

    # ======================================================================
    # Proxy inversé: /api/* → Node.js backend (port 3001)
    # ======================================================================
    ProxyPreserveHost On
    ProxyRequests Off

    <Location /api>
        ProxyPass http://localhost:3001/api
        ProxyPassReverse http://localhost:3001/api
        
        # Headers pour le backend
        RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
        RequestHeader set X-Forwarded-Proto "http"
        RequestHeader set X-Forwarded-Host "%{HTTP_HOST}s"
    </Location>

    # ======================================================================
    # Servir les fichiers statiques (HTML, CSS, JS)
    # ======================================================================
    <Directory /var/www/chatbot-ppv/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Activer les .htaccess (si tu en as)
        # Sinon, les règles de rewrite ci-dessous suffisent
    </Directory>

    # ======================================================================
    # Rewrite pour SPA (Single Page App)
    # Route tous les chemins non-API/non-fichiers vers index.html
    # ======================================================================
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /

        # Ne pas rewrite /api
        RewriteRule ^api/ - [L]
        
        # Ne pas rewrite les fichiers existants
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]
        
        # Ne pas rewrite les dossiers existants
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        
        # Tout le reste → index.html (pour React Router si tu l'ajoutes)
        RewriteRule ^ index.html [QSA,L]
    </IfModule>

    # ======================================================================
    # Compression et cache
    # ======================================================================
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE text/javascript
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/json
    </IfModule>

    # Cache pour les assets statiques
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresDefault "access plus 1 day"
        ExpiresByType text/html "access plus 0 seconds"
        ExpiresByType text/javascript "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
    </IfModule>

    # ======================================================================
    # Headers de sécurité
    # ======================================================================
    <IfModule mod_headers.c>
        # CORS (adapter selon ton domaine frontend)
        Header set Access-Control-Allow-Origin "http://localhost:3000"
        Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header set Access-Control-Allow-Headers "Content-Type, Authorization"
        
        # Sécurité
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-XSS-Protection "1; mode=block"
        
        # CSP (adapter selon tes besoins)
        Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' unpkg.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' data:; connect-src 'self' api.openai.com api.anthropic.com;"
    </IfModule>

</VirtualHost>

